name: Build SenseMaker release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  ctranslate2:
    uses: ./.github/workflows/ctranslate2-clean.yml
    permissions:
      contents: read

  build:
    needs: ctranslate2
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --version=6.7.1 --yes --no-progress

      - name: Download clean CTranslate2 wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ctranslate2-clean-cp314-win_amd64
          path: ctranslate2-wheel

      - name: Create virtual environment and install dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          $wheel = Get-ChildItem 'ctranslate2-wheel\*.whl' | Select-Object -First 1
          if (-not $wheel) { throw 'Clean CTranslate2 wheel not found in the build artifact.' }
          .\.venv\Scripts\python.exe -m pip install --no-deps $wheel.FullName
          .\.venv\Scripts\python.exe -m pip install --require-hashes -r requirements-lock.txt
          .\.venv\Scripts\python.exe -m pip install --require-hashes -r requirements-build.txt
          .\.venv\Scripts\python.exe -m pip check

      - name: Verify clean CTranslate2 install
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = .\.venv\Scripts\python.exe -c "import ctranslate2, pathlib; print(pathlib.Path(ctranslate2.__file__).resolve().parent)"
          $pkg = ($pkg | Select-Object -Last 1)
          if ($pkg) { $pkg = $pkg.Trim() }
          if (-not $pkg -or -not (Test-Path $pkg)) { throw "CTranslate2 package not found at $pkg" }
          $bad = Get-ChildItem $pkg -Recurse -File |
            Where-Object { $_.Name -match '^(cudnn|cublas|cublaslt|cudart|nvrtc|mkl|libiomp|iomp5).*\.dll$' }
          if ($bad) { throw "Forbidden DLLs in the clean wheel: $($bad.Name -join ', ')" }
          if (-not (Test-Path (Join-Path $pkg 'dnnl.dll'))) { throw 'dnnl.dll is missing from the clean wheel.' }
          if (-not (Test-Path (Join-Path $pkg 'tbb12.dll'))) { throw 'tbb12.dll is missing from the clean wheel.' }
          .\.venv\Scripts\python.exe -c "import ctranslate2; print('CTranslate2', ctranslate2.__version__, sorted(ctranslate2.get_supported_compute_types('cpu')))"

      - name: Run security regression tests
        shell: pwsh
        env:
          SENSEMAKER_DATA_DIR: ${{ runner.temp }}\sensemaker-test-data
        run: .\.venv\Scripts\python.exe -m unittest discover -s tests -v

      - name: Build
        shell: pwsh
        run: .\packaging\build.ps1

      - name: Verify build artifacts
        shell: pwsh
        run: |
          $paths = @(
            'dist\SenseMaker\SenseMaker.exe',
            'dist\SenseMaker-Setup-1.1.0.exe'
          )
          foreach ($path in $paths) {
            if (-not (Test-Path $path)) { throw "Missing build artifact: $path" }
            $signature = Get-AuthenticodeSignature $path
            Write-Host "$path : $($signature.Status)"
            if ($signature.Status -eq 'HashMismatch') {
              throw "Invalid signature: $path"
            }
          }
          Write-Warning 'This build is unsigned; the release notes state that clearly.'

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/SenseMaker-Setup-*.exe

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SenseMaker-build
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/SenseMaker-Setup-*.exe
            dist/SHA256SUMS.txt
            dist/release.json
            RELEASE_NOTES.md

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SenseMaker-build
          path: dist

      - name: Verify installer checksum and version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $meta = Get-Content 'dist\release.json' -Raw | ConvertFrom-Json
          $installer = Join-Path 'dist' $meta.installer
          if (-not (Test-Path $installer)) { throw "Installer missing: $installer" }
          $actual = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLower()
          if ($actual -ne $meta.installer_sha256) {
            throw "Installer checksum mismatch: expected $($meta.installer_sha256), got $actual"
          }
          $tagVersion = $env:GITHUB_REF_NAME.TrimStart('v') -replace '-.*$', ''
          if ($meta.version -ne $tagVersion) {
            throw "Tag $env:GITHUB_REF_NAME does not match release version $($meta.version)"
          }

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = Get-ChildItem dist\SenseMaker-Setup-*.exe | Select-Object -First 1
          if (-not $setup) { throw 'Installer not found in dist.' }
          $releaseArgs = @(
            $env:GITHUB_REF_NAME,
            $setup.FullName,
            'dist\SHA256SUMS.txt',
            'dist\release.json',
            '--title', "SenseMaker $env:GITHUB_REF_NAME",
            '--notes-file', 'dist\RELEASE_NOTES.md',
            '--verify-tag'
          )
          if ($env:GITHUB_REF_NAME -match '-') { $releaseArgs += '--prerelease' }
          gh release create @releaseArgs
