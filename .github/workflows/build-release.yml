name: Build SenseMaker release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Create virtual environment and install dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements-lock.txt
          .\.venv\Scripts\python.exe -m pip install -r requirements-build.txt

      - name: Build and sign
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $arguments = @()
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and -not $env:SIGNING_PFX_BASE64) {
            Write-Warning 'Release tag built without signing secrets; publishing an unsigned build.'
          }
          if ($env:SIGNING_PFX_BASE64) {
            $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
            $password = ConvertTo-SecureString $env:SIGNING_PFX_PASSWORD -AsPlainText -Force
            $arguments = @('-PfxPath', $pfx, '-PfxPassword', $password)
          }
          & .\packaging\build.ps1 @arguments

      - name: Verify signing
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
        run: |
          $paths = @(
            'dist\SenseMaker\SenseMaker.exe',
            'dist\SenseMaker-Setup-1.0.0.exe'
          )
          foreach ($path in $paths) {
            $signature = Get-AuthenticodeSignature $path
            Write-Host "$path : $($signature.Status)"
            if ($env:SIGNING_PFX_BASE64 -and $signature.Status -ne 'Valid') {
              throw "Unsigned or invalid installer artifact: $path"
            }
            if (-not $env:SIGNING_PFX_BASE64) {
              Write-Warning "Manual test build is unsigned: $path"
            }
          }

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = Get-ChildItem dist\SenseMaker-Setup-*.exe | Select-Object -First 1
          if (-not $setup) { throw 'Installer not found in dist.' }
          $releaseArgs = @(
            $env:GITHUB_REF_NAME,
            $setup.FullName,
            'dist\SHA256SUMS.txt',
            'dist\release.json',
            '--title', "SenseMaker $env:GITHUB_REF_NAME",
            '--notes-file', 'RELEASE_NOTES.md',
            '--verify-tag'
          )
          if ($env:GITHUB_REF_NAME -match '-') { $releaseArgs += '--prerelease' }
          gh release create @releaseArgs

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SenseMaker-1.0.0
          if-no-files-found: error
          path: |
            dist/SenseMaker-Setup-1.0.0.exe
            dist/SHA256SUMS.txt
            dist/release.json
            dist/SenseMaker/**
